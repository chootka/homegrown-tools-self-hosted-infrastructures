<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meshtastic MQTT Network Diagram</title>
<style>
  body {
    background: #1a1a2e;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Courier New", monospace;
  }
  svg {
    max-width: 1100px;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1100" height="520" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#00cc66" font-family="Courier New" font-size="20" font-weight="bold">Meshtastic → MQTT → Web App</text>

  <!-- ============ PHONE ============ -->
  <rect x="30" y="160" width="120" height="200" rx="12" fill="#2a2a4e" stroke="#555" stroke-width="1.5"/>
  <rect x="42" y="185" width="96" height="140" rx="4" fill="#333366"/>
  <text x="90" y="245" text-anchor="middle" fill="#aaa" font-family="Courier New" font-size="11">Meshtastic</text>
  <text x="90" y="262" text-anchor="middle" fill="#aaa" font-family="Courier New" font-size="11">App</text>
  <circle cx="90" cy="345" r="8" fill="none" stroke="#555" stroke-width="1"/>
  <text x="90" y="400" text-anchor="middle" fill="#888" font-family="Courier New" font-size="12">Phone</text>

  <!-- Arrow: Phone → Device (Bluetooth) -->
  <line x1="150" y1="260" x2="240" y2="260" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="237,254 247,260 237,266" fill="#4ECDC4"/>
  <text x="195" y="248" text-anchor="middle" fill="#4ECDC4" font-family="Courier New" font-size="10">Bluetooth</text>

  <!-- ============ MESHTASTIC DEVICE ============ -->
  <rect x="250" y="190" width="140" height="140" rx="8" fill="#2a2a4e" stroke="#00cc66" stroke-width="1.5"/>
  <!-- Antenna -->
  <line x1="320" y1="190" x2="320" y2="150" stroke="#00cc66" stroke-width="2"/>
  <line x1="310" y1="155" x2="330" y2="155" stroke="#00cc66" stroke-width="2"/>
  <line x1="305" y1="162" x2="335" y2="162" stroke="#00cc66" stroke-width="1.5"/>
  <text x="320" y="240" text-anchor="middle" fill="#00cc66" font-family="Courier New" font-size="12" font-weight="bold">Meshtastic</text>
  <text x="320" y="258" text-anchor="middle" fill="#00cc66" font-family="Courier New" font-size="12" font-weight="bold">Device</text>
  <text x="320" y="280" text-anchor="middle" fill="#666" font-family="Courier New" font-size="9">(Heltec ESP32)</text>
  <text x="320" y="296" text-anchor="middle" fill="#666" font-family="Courier New" font-size="9">WiFi + LoRa</text>
  <text x="320" y="365" text-anchor="middle" fill="#888" font-family="Courier New" font-size="12">Gateway Node</text>

  <!-- LoRa waves to other device -->
  <path d="M 250 220 Q 230 200 250 180" fill="none" stroke="#cc8833" stroke-width="1.5" opacity="0.6"/>
  <path d="M 245 225 Q 220 200 245 175" fill="none" stroke="#cc8833" stroke-width="1" opacity="0.4"/>

  <!-- Other mesh device (small) -->
  <rect x="170" y="80" width="80" height="50" rx="6" fill="#2a2a4e" stroke="#cc8833" stroke-width="1" opacity="0.6"/>
  <text x="210" y="102" text-anchor="middle" fill="#cc8833" font-family="Courier New" font-size="9" opacity="0.8">Other</text>
  <text x="210" y="115" text-anchor="middle" fill="#cc8833" font-family="Courier New" font-size="9" opacity="0.8">Mesh Node</text>
  <line x1="210" y1="80" x2="210" y2="65" stroke="#cc8833" stroke-width="1.5" opacity="0.6"/>
  <line x1="205" y1="68" x2="215" y2="68" stroke="#cc8833" stroke-width="1" opacity="0.6"/>
  <!-- LoRa label -->
  <text x="230" y="148" text-anchor="middle" fill="#cc8833" font-family="Courier New" font-size="10" opacity="0.7">LoRa</text>

  <!-- Arrow: Device → Broker (WiFi/Internet) -->
  <line x1="390" y1="260" x2="500" y2="260" stroke="#45B7D1" stroke-width="2"/>
  <polygon points="497,254 507,260 497,266" fill="#45B7D1"/>
  <text x="448" y="248" text-anchor="middle" fill="#45B7D1" font-family="Courier New" font-size="10">WiFi</text>
  <text x="448" y="235" text-anchor="middle" fill="#45B7D1" font-family="Courier New" font-size="10">MQTT publish</text>

  <!-- Topic label on arrow -->
  <rect x="405" y="272" width="190" height="18" rx="3" fill="#1a1a2e" stroke="#333" stroke-width="0.5"/>
  <text x="500" y="285" text-anchor="middle" fill="#666" font-family="Courier New" font-size="8">msh/afterhours/2/json/broadcasts/#</text>

  <!-- ============ MQTT BROKER ============ -->
  <rect x="510" y="180" width="160" height="160" rx="8" fill="#2a2a4e" stroke="#DDA0DD" stroke-width="1.5"/>
  <!-- Broker icon (hub) -->
  <circle cx="590" cy="225" r="18" fill="none" stroke="#DDA0DD" stroke-width="1.5"/>
  <circle cx="590" cy="225" r="5" fill="#DDA0DD"/>
  <line x1="590" y1="207" x2="590" y2="213" stroke="#DDA0DD" stroke-width="1.5"/>
  <line x1="590" y1="237" x2="590" y2="243" stroke="#DDA0DD" stroke-width="1.5"/>
  <line x1="572" y1="225" x2="578" y2="225" stroke="#DDA0DD" stroke-width="1.5"/>
  <line x1="602" y1="225" x2="608" y2="225" stroke="#DDA0DD" stroke-width="1.5"/>
  <text x="590" y="270" text-anchor="middle" fill="#DDA0DD" font-family="Courier New" font-size="12" font-weight="bold">MQTT Broker</text>
  <text x="590" y="288" text-anchor="middle" fill="#888" font-family="Courier New" font-size="9">mqtt.meshtastic.org</text>
  <text x="590" y="302" text-anchor="middle" fill="#666" font-family="Courier New" font-size="9">port 1883</text>
  <text x="590" y="365" text-anchor="middle" fill="#888" font-family="Courier New" font-size="12">Mosquitto</text>

  <!-- Arrow: Broker → Python App (subscribe) -->
  <line x1="670" y1="260" x2="780" y2="260" stroke="#FF6B6B" stroke-width="2"/>
  <polygon points="777,254 787,260 777,266" fill="#FF6B6B"/>
  <text x="725" y="248" text-anchor="middle" fill="#FF6B6B" font-family="Courier New" font-size="10">MQTT subscribe</text>
  <text x="725" y="235" text-anchor="middle" fill="#FF6B6B" font-family="Courier New" font-size="10">Internet</text>

  <!-- ============ PYTHON APP / SERVER ============ -->
  <rect x="790" y="180" width="140" height="160" rx="8" fill="#2a2a4e" stroke="#FF6B6B" stroke-width="1.5"/>
  <text x="860" y="225" text-anchor="middle" fill="#FF6B6B" font-family="Courier New" font-size="28">{ }</text>
  <text x="860" y="258" text-anchor="middle" fill="#FF6B6B" font-family="Courier New" font-size="12" font-weight="bold">Python App</text>
  <text x="860" y="276" text-anchor="middle" fill="#888" font-family="Courier New" font-size="9">Flask + paho-mqtt</text>
  <text x="860" y="294" text-anchor="middle" fill="#666" font-family="Courier New" font-size="9">Server-Sent Events</text>
  <text x="860" y="365" text-anchor="middle" fill="#888" font-family="Courier New" font-size="12">Your Laptop</text>

  <!-- Arrow: Python App → Browser (SSE) -->
  <line x1="930" y1="260" x2="1010" y2="260" stroke="#FFEAA7" stroke-width="2"/>
  <polygon points="1007,254 1017,260 1007,266" fill="#FFEAA7"/>
  <text x="970" y="248" text-anchor="middle" fill="#FFEAA7" font-family="Courier New" font-size="10">SSE</text>

  <!-- ============ BROWSER ============ -->
  <rect x="1020" y="200" width="60" height="120" rx="6" fill="#2a2a4e" stroke="#FFEAA7" stroke-width="1.5"/>
  <rect x="1028" y="212" width="44" height="70" rx="2" fill="#333355"/>
  <text x="1050" y="245" text-anchor="middle" fill="#FFEAA7" font-family="Courier New" font-size="8">Web</text>
  <text x="1050" y="258" text-anchor="middle" fill="#FFEAA7" font-family="Courier New" font-size="8">Page</text>
  <text x="1050" y="365" text-anchor="middle" fill="#888" font-family="Courier New" font-size="12">Browser</text>

  <!-- Bottom legend -->
  <text x="550" y="440" text-anchor="middle" fill="#555" font-family="Courier New" font-size="11">Message flow: phone types message → Bluetooth → device → LoRa mesh + WiFi → MQTT broker → Python app → browser</text>

  <!-- Protocol legend -->
  <rect x="200" y="465" width="12" height="3" fill="#4ECDC4"/>
  <text x="220" y="470" fill="#4ECDC4" font-family="Courier New" font-size="10">Bluetooth</text>
  <rect x="310" y="465" width="12" height="3" fill="#cc8833"/>
  <text x="330" y="470" fill="#cc8833" font-family="Courier New" font-size="10">LoRa</text>
  <rect x="390" y="465" width="12" height="3" fill="#45B7D1"/>
  <text x="408" y="470" fill="#45B7D1" font-family="Courier New" font-size="10">MQTT publish</text>
  <rect x="520" y="465" width="12" height="3" fill="#FF6B6B"/>
  <text x="538" y="470" fill="#FF6B6B" font-family="Courier New" font-size="10">MQTT subscribe</text>
  <rect x="670" y="465" width="12" height="3" fill="#FFEAA7"/>
  <text x="688" y="470" fill="#FFEAA7" font-family="Courier New" font-size="10">SSE (HTTP)</text>

</svg>
</body>
</html>
